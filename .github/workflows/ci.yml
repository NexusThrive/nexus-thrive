name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base efímera del job: el script de integración exige que ambas coincidan.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Historial completo: el chequeo de SQL de producción compara contra la
      # rama base, que un checkout superficial no trae (y se omitía en silencio).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La versión de pnpm sale de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Núcleo de ingeniería: independiente de Node, sin servicios externos.
      - name: Núcleo de ingeniería (Python)
        run: |
          python3 -m unittest discover -s packages/nexus-engineering-core/tests
          bash ./scripts/nexus-eng validate

      # Si cambió prisma/contract.prisma, el PR trae su SQL en docs/prod-sql/.
      - name: SQL de producción si cambió el modelo
        if: github.event_name == 'pull_request'
        run: bash ./scripts/check-prod-sql.sh "origin/${{ github.base_ref }}"

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Sin TEST_DATABASE_URL las de integración se omiten: corren después,
      # cuando la base ya está migrada.
      - name: Unit tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: ""

      # El catálogo de componentes también se valida: una historia rota
      # rompe el build de Storybook.
      - name: Storybook
        run: pnpm build-storybook

      - name: Migraciones sobre base limpia
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          pnpm exec prisma db migrate --db "$DATABASE_URL"
          # SEC-07: toda tabla con RLS (sin políticas cierra la API REST de Supabase).
          sin_rls=$(psql "$DATABASE_URL" -tAc "select string_agg(tablename, ', ') from pg_tables where schemaname = 'public' and not rowsecurity")
          if [ -n "$sin_rls" ]; then echo "Tablas sin RLS (agrega @@rls en el contrato): $sin_rls"; exit 1; fi

      - name: Integration tests
        run: pnpm test:integration
