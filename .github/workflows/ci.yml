name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base efímera del job: el script de integración exige que ambas coincidan.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Sin TEST_DATABASE_URL las de integración se omiten: corren después,
      # cuando la base ya está migrada.
      - name: Unit tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: ""

      # El catálogo de componentes también se valida: una historia rota
      # rompe el build de Storybook.
      - name: Storybook
        run: pnpm build-storybook

      - name: Migraciones sobre base limpia
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          pnpm exec prisma db migrate --db "$DATABASE_URL"

      - name: Integration tests
        run: pnpm test:integration
