stages:
  - check
  - test

variables:
  PNPM_VERSION: "9.15.9"
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"
  FF_USE_FASTZIP: "true"

default:
  image: node:20-bullseye
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

lint:
  stage: check
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
  timeout: 15m

typecheck:
  stage: check
  script:
    - pnpm exec tsc --noEmit
  needs: ["lint"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
  timeout: 20m

test:unit:
  stage: test
  script:
    - pnpm test -- --run
  needs: ["typecheck"]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
  timeout: 30m
